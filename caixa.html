<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0908">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Caixa | Front Beer</title>

<link rel="icon" href="assets/img/favicon.png" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/admin.css">
<link rel="stylesheet" href="assets/css/caixa.css">
</head>
<body data-pagina="caixa">

<!-- ==================== ACESSO ==================== -->
<section class="acesso" id="telaAcesso">
  <div class="acesso__caixa">
    <img class="acesso__emblema" src="assets/img/emblema.png" alt="" width="74" height="74">
    <h1 data-marca>Front Beer</h1>
    <p class="acesso__sub">Caixa</p>
    <div id="erroAcesso" class="nota nota--erro oculto" style="margin-bottom:16px"></div>
    <form id="formAcesso" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--bloco" id="btnEntrar">Entrar</button>
    </form>
  </div>
</section>

<!-- ==================== CAIXA ==================== -->
<div class="app oculto" id="telaCaixa">

  <aside class="lateral" data-nav></aside>

  <div class="conteudo">
    <header class="barra" data-barra></header>

  <div class="tira-dia">
    <div><span>Vendas hoje</span><strong id="diaQtd">0</strong></div>
    <div><span>Faturamento do dia</span><strong class="ouro" id="diaTotal">R$ 0,00</strong></div>
    <div><span>Ticket médio</span><strong id="diaTicket">—</strong></div>
    <div><span>Última venda</span><strong id="diaUltima">—</strong></div>
  </div>

    <div class="caixa">

    <!-- ---------- Catálogo ---------- -->
    <section class="catalogo">
      <div class="catalogo__filtros">
        <div class="busca-caixa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <input type="search" id="buscaProduto" class="entrada" autocomplete="off"
                 placeholder="Digite para filtrar e pressione Enter para adicionar o primeiro resultado">
        </div>
      </div>
      <div id="catalogo"></div>
    </section>

    <!-- ---------- Comanda ---------- -->
    <aside>
      <div class="comanda">
        <div class="comanda__cabeca">
          <h2>Venda atual</h2>
          <span class="contagem" id="contagemItens">nenhum item</span>
        </div>

        <div class="comanda__itens" id="comandaItens">
          <div class="comanda__vazia">Toque nos produtos ao lado<br>para montar a venda.</div>
        </div>

        <div class="comanda__pe">
          <div class="comanda__total">
            <span>Total</span>
            <strong id="comandaTotal">R$ 0,00</strong>
          </div>

          <div class="pagamentos" id="pagamentos">
            <button type="button" class="pagamento ativo" data-pg="dinheiro">Dinheiro</button>
            <button type="button" class="pagamento" data-pg="pix">PIX</button>
            <button type="button" class="pagamento" data-pg="debito">Débito</button>
            <button type="button" class="pagamento" data-pg="credito">Crédito</button>
          </div>

          <div class="campo" style="margin-bottom:12px">
            <input type="text" id="observacao" class="entrada" maxlength="200" placeholder="Observação (opcional)">
          </div>

          <button type="button" class="btn btn--confirmar btn--bloco" id="btnFechar" disabled>
            Fechar venda
          </button>
          <button type="button" class="btn btn--cancelar btn--bloco btn--pequeno" id="btnCancelar" style="margin-top:8px">
            Cancelar venda
          </button>
        </div>
      </div>

      <div class="ultimas">
        <h3>Últimas vendas de hoje</h3>
        <div id="ultimasVendas"></div>
      </div>
      </aside>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/caixa.js"></script>
</body>
</html>
