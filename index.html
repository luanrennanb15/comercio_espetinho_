<title>Front Beer — Adega e Petiscaria | Cardápio</title>

<link rel="canonical" href="https://espetinho-front-beer.vercel.app/">
<link rel="icon" href="assets/img/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

<meta property="og:url" content="https://espetinho-front-beer.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Front Beer">

<!-- Ficha do estabelecimento em linguagem de máquina. É isto que
     permite ao Google ligar este site à ficha do Maps e mostrar
     horário e telefone direto no resultado da busca.

     Fica estático de propósito: JSON-LD injetado por JavaScript é
     lido com menos confiabilidade. Em troca, um teste automatizado
     confere que estes valores continuam iguais aos do config.js —
     se um dia mudar lá e não aqui, a bateria reprova. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BarOrPub",
  "name": "Front Beer",
  "alternateName": "Front Beer — Adega e Petiscaria",
  "description": "Adega e petiscaria com espetos na brasa, petiscos, cervejas geladas e destilados. Consumo e retirada no local.",
  "url": "https://espetinho-front-beer.vercel.app/",
  "image": "https://espetinho-front-beer.vercel.app/assets/img/og.jpg",
  "logo": "https://espetinho-front-beer.vercel.app/assets/img/emblema.png",
  "telephone": "+5515981427143",
  "priceRange": "$$",
  "currenciesAccepted": "BRL",
  "paymentAccepted": "Dinheiro, Pix, Cartão de débito, Cartão de crédito",
  "servesCuisine": ["Petiscos", "Espetinhos"],
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Antônio Silva Saladino, 875",
    "addressCountry": "BR"
  },
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
    "opens": "16:00",
    "closes": "02:00"
  }],
  "sameAs": ["https://instagram.com/frontbeer_adega"],
  "hasMenu": "https://espetinho-front-beer.vercel.app/"
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap">

<script>
/* Aplica o tema salvo antes do CSS carregar, para a tela não piscar. */
(function () {
  try {
    var t = localStorage.getItem("frontbeer:tema");
    if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro";
    document.documentElement.setAttribute("data-tema", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20260827b">
<link rel="stylesheet" href="assets/css/base.css?v=20260827b">
<link rel="stylesheet" href="assets/css/cardapio.css?v=20260827b">
</head>
<body>

<!-- ============ Barra fixa ============ -->
<header class="topo-fixo" id="topoFixo">
  <div class="container topo-fixo__interno">
    <a class="marca-mini" href="#">
      <img src="assets/img/emblema.png" alt="" width="34" height="34">
      <strong data-marca>Front Beer</strong>
    </a>
    <div class="topo-fixo__acoes" id="acoesTopo"></div>
  </div>
</header>

<!-- ============ Capa ============ -->
<section class="capa">
  <!-- A foto oficial já traz o logo e o nome; o h1 fica invisível para
       leitores de tela e buscadores, sem repetir a marca na tela. -->
  <h1 class="sr-only"><span data-marca>Front Beer</span> — <span data-segmento>Adega e Petiscaria</span></h1>

  <picture class="capa__imagem">
    <source media="(max-width: 700px)" srcset="assets/img/capa-900.jpg">
    <img src="assets/img/capa.jpg" alt="Front Beer, adega e petiscaria: chope, tábua de petiscos e o letreiro da casa"
         width="1600" height="1067" fetchpriority="high" decoding="async">
  </picture>

  <div class="container capa__interno">
    <p class="capa__lema" id="lema"></p>
    <div class="capa__redes" id="redesLoja"></div>
    <div class="capa__dados" id="dadosLoja"></div>
  </div>
</section>

<!-- ============ Navegação ============ -->
<nav class="nav-cardapio" aria-label="Filtros do cardápio">
  <div class="container">
    <div class="busca-caixa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input type="search" id="busca" class="entrada" placeholder="Buscar no cardápio..." autocomplete="off" aria-label="Buscar no cardápio">
    </div>
    <div class="abas" id="abas" role="tablist"></div>
  </div>
</nav>

<!-- ============ Cardápio ============ -->
<main class="container" id="cardapio">
  <div class="secao">
    <div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>
  </div>
</main>

<!-- ============ Rodapé ============ -->
<footer class="rodape">
  <div class="container">
    <p class="rodape__legal">
      <strong>Proibida a venda de bebidas alcoólicas a menores de <span id="idadeMinima">18</span> anos.</strong>
      Lei Federal nº 13.106/2015. Aprecie com moderação. Se beber, não dirija.
    </p>
    <p class="rodape__info" id="rodapeInfo"></p>
    <p class="rodape__fim">
      <span id="avisoOperacao"></span><br>
      <span id="atualizacao"></span>
      Preços sujeitos a alteração sem aviso prévio.
      <span id="credito"></span>
    </p>
  </div>
</footer>

<button type="button" class="ao-topo" id="aoTopo" aria-label="Voltar ao topo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
    <path d="m6 14 6-6 6 6"/>
  </svg>
</button>

<script src="assets/js/config.js?v=20260827b"></script>
<script src="assets/js/ui.js?v=20260827b"></script>
<script src="assets/js/tema.js?v=20260827b"></script>
<script src="assets/js/db.js?v=20260827b"></script>
<script src="assets/js/cardapio.js?v=20260827b"></script>
</body>
</html>
