<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<meta name="description" content="Cardápio da Front Beer — adega e petiscaria. Espetos na brasa, petiscos, cervejas geladas e destilados. Consumo e retirada no local.">
<meta name="referrer" content="no-referrer">

<title>Front Beer — Adega e Petiscaria | Cardápio</title>

<link rel="icon" href="assets/img/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Front Beer">
<meta property="og:title" content="Front Beer — Adega e Petiscaria">
<meta property="og:description" content="Espetos na brasa, petiscos, cervejas geladas e destilados. Veja o cardápio completo.">
<meta property="og:image" content="assets/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="assets/css/tokens.css?v=20260826a">
<link rel="stylesheet" href="assets/css/base.css?v=20260826a">
<link rel="stylesheet" href="assets/css/cardapio.css?v=20260826a">
</head>
<body>

<!-- ============ Barra fixa ============ -->
<header class="topo-fixo" id="topoFixo">
  <div class="container topo-fixo__interno">
    <a class="marca-mini" href="#">
      <img src="assets/img/emblema.png" alt="" width="34" height="34">
      <strong data-marca>Front Beer</strong>
    </a>
  </div>
</header>

<!-- ============ Capa ============ -->
<section class="capa">
  <div class="capa__fundo" aria-hidden="true"></div>
  <div class="capa__veu" aria-hidden="true"></div>
  <div class="container capa__interno">
    <img class="capa__emblema" src="assets/img/emblema.png" alt="Emblema Front Beer" width="108" height="108">
    <h1 class="capa__nome" data-marca>Front Beer</h1>
    <p class="capa__sub" data-segmento>Adega e Petiscaria</p>
    <p class="capa__lema" id="lema"></p>
    <div class="capa__dados" id="dadosLoja"></div>
  </div>
</section>

<!-- ============ Navegação ============ -->
<nav class="nav-cardapio" aria-label="Filtros do cardápio">
  <div class="container">
    <div class="busca-caixa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input type="search" id="busca" class="entrada" placeholder="Buscar no cardápio..." autocomplete="off" aria-label="Buscar no cardápio">
    </div>
    <div class="abas" id="abas" role="tablist"></div>
  </div>
</nav>

<!-- ============ Cardápio ============ -->
<main class="container" id="cardapio">
  <div class="secao">
    <div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>
  </div>
</main>

<!-- ============ Rodapé ============ -->
<footer class="rodape">
  <div class="container">
    <p class="rodape__legal">
      <strong>Proibida a venda de bebidas alcoólicas a menores de <span id="idadeMinima">18</span> anos.</strong>
      Lei Federal nº 13.106/2015. Aprecie com moderação. Se beber, não dirija.
    </p>
    <p class="rodape__info" id="rodapeInfo"></p>
    <p class="rodape__fim">
      <span id="avisoOperacao"></span><br>
      <span id="atualizacao"></span>
      Preços sujeitos a alteração sem aviso prévio.
      <span id="credito"></span>
    </p>
  </div>
</footer>

<button type="button" class="ao-topo" id="aoTopo" aria-label="Voltar ao topo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
    <path d="m6 14 6-6 6 6"/>
  </svg>
</button>

<script src="assets/js/config.js?v=20260826a"></script>
<script src="assets/js/ui.js?v=20260826a"></script>
<script src="assets/js/db.js?v=20260826a"></script>
<script src="assets/js/cardapio.js?v=20260826a"></script>
</body>
</html>
