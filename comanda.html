<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0908">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Minha comanda | Front Beer</title>

<link rel="icon" href="assets/img/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap">

<script>
/* Aplica o tema salvo antes do CSS carregar, para a tela não piscar. */
(function () {
  try {
    var t = localStorage.getItem("frontbeer:tema");
    if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro";
    document.documentElement.setAttribute("data-tema", t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="assets/css/tokens.css?v=20260826e">
<link rel="stylesheet" href="assets/css/base.css?v=20260826e">
<style>
  .extrato { max-width: 520px; margin-inline: auto; padding: 26px 18px 60px; }

  .extrato__topo { position: relative; text-align: center; margin-bottom: 24px; }
  .extrato__acoes { position: absolute; top: 0; right: 0; }
  .extrato__topo img { width: 62px; height: 62px; margin: 0 auto 12px; }
  .extrato__topo h1 { font-size: 1.4rem; letter-spacing: .03em; }
  .extrato__topo h1 em { color: var(--ouro); font-style: italic; }

  .cartao-num {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 14px; padding: 8px 18px;
    background: var(--superficie); border: 1px solid var(--linha-forte);
    border-radius: 999px;
  }
  .cartao-num span {
    font-size: .66rem; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: var(--texto-fraco);
  }
  .cartao-num strong { font-family: var(--fonte-titulo); font-size: 1.5rem; color: var(--ouro); }

  .lista { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-md); overflow: hidden; }

  .linha-item {
    display: grid;
    grid-template-columns: 42px 1fr auto;
    gap: 4px 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--linha);
  }
  .linha-item:last-child { border-bottom: 0; }
  .linha-item__qtd {
    grid-row: 1 / 3;
    align-self: center;
    display: grid; place-items: center;
    height: 30px;
    font-size: .85rem; font-weight: 700;
    color: var(--ouro);
    background: var(--alerta-bg);
    border-radius: var(--raio);
  }
  .linha-item__nome { font-size: .94rem; font-weight: 600; }
  .linha-item__hora { font-size: .74rem; color: var(--texto-fraco); font-variant-numeric: tabular-nums; }
  .linha-item__valor {
    grid-row: 1 / 3; align-self: center;
    font-family: var(--fonte-titulo); font-weight: 700;
    color: var(--ouro); white-space: nowrap;
  }

  .total {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-top: 16px; padding: 18px 20px;
    background: var(--superficie-2);
    border: 1px solid var(--linha-forte);
    border-radius: var(--raio-md);
  }
  .total span { font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--texto-fraco); }
  .total strong { font-family: var(--fonte-titulo); font-size: 2rem; color: var(--ouro); }

  .aviso-leitura {
    margin-top: 16px; padding: 12px 15px;
    font-size: .8rem; line-height: 1.55; color: var(--texto-fraco);
    background: var(--superficie); border: 1px solid var(--linha);
    border-radius: var(--raio);
  }

  .estado-msg { padding: 56px 20px; text-align: center; }
  .estado-msg strong { display: block; margin-bottom: 8px; font-size: 1.15rem; color: var(--texto); }
  .estado-msg p { margin: 0; color: var(--texto-fraco); font-size: .9rem; line-height: 1.6; }

  .rodape-extrato { margin-top: 26px; text-align: center; font-size: .76rem; color: var(--texto-fraco); line-height: 1.7; }
  .atualizado { display: block; margin-top: 6px; }
</style>
</head>
<body>

<div class="extrato">
  <header class="extrato__topo">
    <div class="extrato__acoes" id="acoesExtrato"></div>
    <img src="assets/img/emblema.png" alt="">
    <h1 data-marca>Front Beer</h1>
    <div class="cartao-num oculto" id="caixaNumero">
      <span>Comanda</span><strong id="numero">—</strong>
    </div>
  </header>

  <main id="conteudo">
    <div class="estado-msg"><strong>Carregando...</strong><p>Buscando o seu consumo.</p></div>
  </main>

  <p class="rodape-extrato">
    Esta tela é apenas informativa. O lançamento e o pagamento são feitos pelo atendente.
    <span class="atualizado" id="atualizado"></span>
  </p>
</div>

<script src="assets/js/config.js?v=20260826e"></script>
<script src="assets/js/ui.js?v=20260826e"></script>
<script src="assets/js/tema.js?v=20260826e"></script>
<script src="assets/js/db.js?v=20260826e"></script>
<script src="assets/js/comanda.js?v=20260826e"></script>
</body>
</html>
